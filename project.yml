# 饭耳 · XcodeGen 工程描述
# 通过 XcodeGen 生成 FanEr.xcodeproj（本地或 Codemagic 构建时自动生成）
# 目标结构：FanEr（iPhone 主 App）内嵌 FanErWatch（watchOS App）
name: FanEr

options:
  bundleIdPrefix: com.faner
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  # iPhone 端：转写、AI 整理、待办卡、小耳助理、BYOK 设置
  FanEr:
    type: application
    platform: iOS
    info:
      path: Info/FanEr-Info.plist
      properties:
        CFBundleDisplayName: 饭耳
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 饭耳需要使用麦克风录制并整理对话内容。
        UIBackgroundModes:
          - audio
    sources:
      - path: FanEr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faner.app
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      # 内嵌 Watch App（XcodeGen 会自动生成 Embed Watch Content 拷贝阶段）
      - target: FanErWatch
        embed: true

  # Watch 端：常驻录音、分块传输、状态展示
  FanErWatch:
    type: application
    platform: watchOS
    info:
      path: Info/FanErWatch-Info.plist
      properties:
        CFBundleDisplayName: 饭耳
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.faner.app
        NSMicrophoneUsageDescription: 饭耳需要在 Watch 上持续录音，并在本地分块后传到 iPhone。
        UIBackgroundModes:
          - audio
    sources:
      - path: FanErWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faner.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

schemes:
  FanEr:
    build:
      targets:
        FanEr: all
    run:
      config: Debug
    archive:
      config: Release

  FanErWatch:
    build:
      targets:
        FanErWatch: all
    run:
      config: Debug
    archive:
      config: Release
